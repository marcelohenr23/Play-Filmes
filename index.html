<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Carregando</title>
    <style>
        :root {
            --bg-color: #070913;
            --neon-blue: #00f0ff;
            --neon-glow: rgba(0, 240, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #8c9bae;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            cursor: pointer;
        }

        .logo-box {
            position: relative;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #111a30, #0a0f1d);
            border: 2px solid var(--neon-blue);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px var(--neon-glow), inset 0 0 15px rgba(0, 240, 255, 0.2);
            margin-bottom: 25px;
            animation: pulseGlow 2s infinite alternate;
        }

        .logo-box svg {
            width: 70px;
            height: 70px;
            fill: var(--neon-blue);
            filter: drop-shadow(0 0 8px var(--neon-blue));
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            background: linear-gradient(90deg, #ffffff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        p {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        .loader-bar {
            width: 140px;
            height: 4px;
            background: #111a30;
            border-radius: 4px;
            margin-top: 35px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            animation: loadingMove 1.8s infinite linear;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.1); }
            100% { box-shadow: 0 0 35px rgba(0, 240, 255, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.4); }
        }

        @keyframes loadingMove {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body onclick="irParaLogin()">

    <div class="splash-container">
        <div class="logo-box">
            <svg viewBox="0 0 24 24">
                <path d="M18,5H16.89C17.47,4.11 17.8,3.08 17.8,2H15.8C15.8,3.11 15.2,4.09 14.33,4.64C13.8,3.7 12.96,3 12,3C11.04,3 10.2,3.7 9.67,4.64C8.8,4.09 8.2,3.11 8.2,2H6.2C6.2,3.08 6.53,4.11 7.11,5H6C4.89,5 4,5.89 4,7V20C4,21.1 4.89,22 6,22H18C19.1,22 20,21.1 20,20V7C20,5.89 19.1,5 18,5M18,20H6V7H18V20M9.5,9A1.5,1.5 0 0,0 8,10.5A1.5,1.5 0 0,0 9.5,12A1.5,1.5 0 0,0 11,10.5A1.5,1.5 0 0,0 9.5,9M14.5,9A1.5,1.5 0 0,0 13,10.5A1.5,1.5 0 0,0 14.5,12A1.5,1.5 0 0,0 16,10.5A1.5,1.5 0 0,0 14.5,9M9.5,13.5A1.5,1.5 0 0,0 8,15A1.5,1.5 0 0,0 9.5,16.5A1.5,1.5 0 0,0 11,15A1.5,1.5 0 0,0 9.5,13.5M14.5,13.5A1.5,1.5 0 0,0 13,15A1.5,1.5 0 0,0 14.5,16.5A1.5,1.5 0 0,0 16,15A1.5,1.5 0 0,0 14.5,13.5Z"/>
            </svg>
        </div>

        <h1>PLAY FILMES</h1>
        <p>Cinema em cada detalhe</p>

        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <script>
        function irParaLogin() {
            window.location.href = "login.html";
        }

        // Passa para a tela de login automaticamente após 3 segundos
        setTimeout(() => {
            irParaLogin();
        }, 3000);
    </script>

</body>
</html>
