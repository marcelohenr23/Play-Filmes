<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes</title>
    <style>
        :root {
            --bg-color: #0a0f1e;
            --card-bg: #111625;
            --header-bg: #111625;
            --primary-color: #007bff;
            --text-color: #ffffff;
            --text-muted: #a0aab5;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* CABEÇALHO E MENU */
        header {
            background-color: var(--header-bg);
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid #1f2940;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: var(--header-bg);
            padding: 12px;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        nav button {
            background-color: transparent;
            color: var(--text-muted);
            border: 2px solid transparent;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        nav button:hover {
            color: var(--text-color);
            background-color: rgba(255,255,255,0.05);
        }

        nav button.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* BARRA DE PESQUISA */
        .search-container {
            padding: 15px 20px 0 20px;
            max-width: 1200px;
            margin: auto;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background-color: var(--card-bg);
            border: 1px solid #1f2940;
            border-radius: 25px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
        }

        .search-box svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
        }

        /* CONTEÚDO E PÁGINAS */
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .page-content {
            display: none;
        }

        .page-content.active-page {
            display: block;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            margin-top: 25px;
            color: var(--text-color);
            font-weight: 700;
            display: flex;
            align-items: center;
        }
        
        .section-title::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 20px;
            background-color: var(--primary-color);
            margin-right: 10px;
            border-radius: 3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
            border-color: rgba(0, 123, 255, 0.3);
        }

        .card img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            border-bottom: 1px solid #1f2940;
        }

        .card p {
            font-size: 12px;
            margin: 8px 5px 0 5px;
            color: var(--text-color);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- TELA DE DETALHES --- */
        #details-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 9000;
            display: none;
            overflow-y: auto;
        }

        #details-screen.active {
            display: block;
        }

        .details-header-bg {
            width: 100%;
            height: 240px;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        .details-header-bg iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        .close-details-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 9001;
        }

        .details-content {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .details-title {
            font-size: 26px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .details-info-tags {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            align-items: center;
        }

        .badge-age {
            background-color: #d97706;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
        }

        .btn-play-large {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .btn-play-large:hover {
            background-color: #d1d5db;
        }

        .details-synopsis {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .details-actions {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            gap: 5px;
        }

        .action-item:hover {
            color: var(--text-color);
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .similar-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #1f2940;
            transition: transform 0.2s;
        }

        .similar-card:hover {
            transform: scale(1.03);
            border-color: var(--primary-color);
        }

        .similar-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            display: block;
        }

        .similar-card-info {
            padding: 8px;
        }

        .similar-card-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-color);
            margin: 0 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .similar-card-desc {
            font-size: 10px;
            color: var(--text-muted);
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        /* --- TELA DO PLAYER DE VÍDEO --- */
        #player-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #player-screen.active {
            display: flex;
        }

        .player-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10001;
        }

        .video-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- --- TELA DE DETALHES --- -->
    <div id="details-screen">
        <div class="details-header-bg" id="detailsHeaderContainer">
            <button class="close-details-btn" onclick="closeDetails()">⬅ Voltar</button>
        </div>
        <div class="details-content">
            <div class="details-title" id="detTitle">Nome do Filme</div>
            <div class="details-info-tags">
                <span class="badge-age">16</span>
                <span>2024</span>
                <span>1h 45min</span>
                <span style="border: 1px solid var(--text-muted); padding: 0 4px; font-size: 10px; border-radius: 3px;">HD</span>
            </div>
            
            <button class="btn-play-large" onclick="startPlaying()">
                ▶ Assistir Filme Completo
            </button>

            <div class="details-synopsis" id="detSynopsis">
                Sinopse do filme selecionado.
            </div>

            <div class="details-actions">
                <div class="action-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Minha Lista
                </div>
                <div class="action-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    Avaliar
                </div>
                <div class="action-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                    Compartilhar
                </div>
            </div>

            <!-- SEÇÃO DE FILMES SEMELHANTES -->
            <div class="section-title" style="margin-top: 30px;">Próximos e Semelhantes</div>
            <div class="similar-grid" id="similarMoviesGrid"></div>
        </div>
    </div>

    <!-- --- TELA DO PLAYER DE VÍDEO --- -->
    <div id="player-screen">
        <div class="player-header">
            <button class="close-details-btn" onclick="closePlayer()">⬅ Voltar</button>
        </div>
        <div class="video-container">
            <video id="videoPlayer" controls autoplay>
                <source id="videoSource" src="" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>
        </div>
    </div>

    <!-- CABEÇALHO -->
    <header>Play Filmes 🎬</header>

    <!-- MENU DE NAVEGAÇÃO -->
    <nav>
        <button onclick="switchTab('inicio', event)" class="active">Início</button>
        <button onclick="switchTab('filmes', event)">Filmes</button>
        <button onclick="switchTab('series', event)">Séries</button>
        <button onclick="switchTab('canais', event)">Canais</button>
    </nav>

    <!-- BARRA DE PESQUISA -->
    <div class="search-container">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Pesquisar filmes, séries, canais...">
        </div>
    </div>

    <div class="container">

        <!-- ================= PÁGINA INÍCIO ================= -->
        <div id="inicio" class="page-content active-page">
            <div class="section-title">Filmes em Destaque</div>
            <div class="grid">
                <div class="card" onclick="openDetails('Ong Bak 2', 'O guerreiro Tien busca vingança e enfrenta inimigos poderosos.', 'img/ongbak2.jpg', '')">
                    <img src="img/ongbak2.jpg" alt="Ong Bak 2">
                    <p>Ong Bak 2</p>
                </div>
                <div class="card" onclick="openDetails('Ong Bak 3', 'Tien retorna para enfrentar seu maior desafio na conclusão da saga.', 'img/ongbak3.jpg', '')">
                    <img src="img/ongbak3.jpg" alt="Ong Bak 3">
                    <p>Ong Bak 3</p>
                </div>
            </div>
        </div>

        <!-- ================= PÁGINA FILMES ================= -->
        <div id="filmes" class="page-content">
            <div class="section-title">Lista de Filmes</div>
            <div class="grid">
                <div class="card" onclick="openDetails('Ong Bak 2', 'O guerreiro Tien busca vingança e enfrenta inimigos poderosos.', 'img/ongbak2.jpg', '')">
                    <img src="img/ongbak2.jpg" alt="Ong Bak 2">
                    <p>Ong Bak 2</p>
                </div>
                <div class="card" onclick="openDetails('Ong Bak 3', 'Tien retorna para enfrentar seu maior desafio na conclusão da saga.', 'img/ongbak3.jpg', '')">
                    <img src="img/ongbak3.jpg" alt="Ong Bak 3">
                    <p>Ong Bak 3</p>
                </div>
            </div>
        </div>

        <!-- ================= PÁGINA SÉRIES ================= -->
        <div id="series" class="page-content">
            <div class="section-title">Séries</div>
            <div class="grid" style="color: var(--text-muted); font-size: 14px;">
                Nenhuma série adicionada ainda.
            </div>
        </div>

        <!-- ================= PÁGINA CANAIS ================= -->
        <div id="canais" class="page-content">
            <div class="section-title">Canais Ao Vivo</div>
            <div class="grid" style="color: var(--text-muted); font-size: 14px;">
                Nenhum canal adicionado ainda.
            </div>
        </div>

    </div>

    <!-- SCRIPT CORRIGIDO -->
    <script>
        function switchTab(pageId, event) {
            const pages = document.querySelectorAll('.page-content');
            pages.forEach(page => page.classList.remove('active-page'));

            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.add('active-page');
            }

            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        function openDetails(title, synopsis, image, youtubeEmbedUrl) {
            document.getElementById('detTitle').innerText = title;
            document.getElementById('detSynopsis').innerText = synopsis;
            
            const headerContainer = document.getElementById('detailsHeaderContainer');
            const existingIframe = headerContainer.querySelector('iframe');
            if (existingIframe) {
                existingIframe.remove();
            }

            if (youtubeEmbedUrl) {
                const iframe = document.createElement('iframe');
                iframe.src = youtubeEmbedUrl;
                iframe.allow = "autoplay; encrypted-media";
                headerContainer.appendChild(iframe);
            }

            const similarGrid = document.getElementById('similarMoviesGrid');
            similarGrid.innerHTML = '';

            const allMovies = [
                { title: 'Ong Bak 2', syn: 'O guerreiro Tien busca vingança e enfrenta inimigos poderosos.', img: 'img/ongbak2.jpg', yt: '' },
                { title: 'Ong Bak 3', syn: 'Tien retorna para enfrentar seu maior desafio na conclusão da saga.', img: 'img/ongbak3.jpg', yt: '' }
            ];

            const filteredMovies = allMovies.filter(movie => movie.title !== title);

            filteredMovies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'similar-card';
                card.onclick = () => openDetails(movie.title, movie.syn, movie.img, movie.yt);
                card.innerHTML = `
                    <img src="${movie.img}" alt="${movie.title}">
                    <div class="similar-card-info">
                        <p class="similar-card-title">${movie.title}</p>
                        <p class="similar-card-desc">${movie.syn}</p>
                    </div>
                `;
                similarGrid.appendChild(card);
            });

            document.getElementById('details-screen').classList.add('active');
        }

        function closeDetails() {
            document.getElementById('details-screen').classList.remove('active');
            const headerContainer = document.getElementById('detailsHeaderContainer');
            const existingIframe = headerContainer.querySelector('iframe');
            if (existingIframe) {
                existingIframe.remove();
            }
        }

        function startPlaying() {
            closeDetails();
            const playerScreen = document.getElementById('player-screen');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoSource = document.getElementById('videoSource');

            videoSource.src = "https://www.w3schools.com/html/mov_bbb.mp4";
            videoPlayer.load();
