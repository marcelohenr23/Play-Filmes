<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <h1>CRIAR CONTA</h1>
        
        <!-- Mensagem de sucesso (inicialmente escondida) -->
        <div id="mensagem-sucesso" style="display: none; background: rgba(0, 210, 255, 0.2); border: 1px solid #00d2ff; color: #00d2ff; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; text-align: center;">
            Cadastro realizado com sucesso! Redirecionando...
        </div>

        <form id="form-cadastro" onsubmit="realizarCadastro(event)">
            <div style="margin-bottom: 15px;">
                <input type="text" placeholder="Nome Completo" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <input type="email" placeholder="E-mail" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <input type="password" placeholder="Senha" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff;" required>
            </div>
            <div style="margin-bottom: 20px;">
                <input type="password" placeholder="Confirmar Senha" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff;" required>
            </div>
            <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; background: #0055ff; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer;">Cadastrar</button>
        </form>
        <div style="margin-top: 15px;">
            <a href="login.html" style="color: #00d2ff; text-decoration: none; font-size: 14px;">Já tem uma conta? Entre aqui</a>
        </div>
    </div>

    <script>
        function realizarCadastro(event) {
            event.preventDefault(); // Evita que a página recarregue seco
            
            // Esconde o formulário e mostra a mensagem de sucesso
            document.getElementById('form-cadastro').style.display = 'none';
            document.getElementById('mensagem-sucesso').style.display = 'block';

            // Aguarda 2 segundos e joga para a página de login
            setTimeout(function() {
                window.location.href = "login.html";
            }, 2000);
        }
    </script>
</body>
</html>
