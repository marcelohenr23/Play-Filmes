<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <h1>CRIAR CONTA</h1>
        <form>
            <div style="margin-bottom: 15px;">
                <input type="text" placeholder="Nome Completo" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <input type="email" placeholder="E-mail" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <input type="password" placeholder="Senha" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff;" required>
            </div>
            <div style="margin-bottom: 20px;">
                <input type="password" placeholder="Confirmar Senha" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff;" required>
            </div>
            <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; background: #0055ff; color: #fff; font-weight: bold; font-size: 16px;">Cadastrar</button>
        </form>
        <div style="margin-top: 15px;">
            <a href="login.html" style="color: #00d2ff; text-decoration: none; font-size: 14px;">Já tem uma conta? Entre aqui</a>
        </div>
    </div>
</body>
</html>
