<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Entrar</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <style>
        /* Fundo escuro e centralização perfeita igual ao cadastro */
        body {
            background-color: #050811 !important;
            color: #ffffff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>PLAY FILMES</h1>
        <form onsubmit="event.preventDefault(); localStorage.setItem('usuarioLogado', 'true'); window.location.href='perfil.html';">
            <div style="margin-bottom: 15px;">
                <input type="email" placeholder="E-mail" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff; box-sizing: border-box;" required>
            </div>
            <div style="margin-bottom: 20px;">
                <input type="password" placeholder="Senha" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0055ff; background: #050811; color: #fff; box-sizing: border-box;" required>
            </div>
            <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; background: #0055ff; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; border: none;">Entrar</button>
        </form>
        <div style="margin-top: 15px; text-align: center;">
            <a href="cadastro.html" style="color: #00d2ff; text-decoration: none; font-size: 14px;">Não tem uma conta? Cadastre-se</a>
        </div>
    </div>
</body>
</html>
