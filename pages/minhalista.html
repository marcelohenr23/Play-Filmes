<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Minha Lista</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #050811; color: #fff; margin: 0; padding-bottom: 50px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0a0f1d; border-bottom: 1px solid #0055ff; }
        .logo { color: #00d2ff; font-weight: bold; font-size: 1.2rem; }
        
        .filtros-nav { display: flex; gap: 15px; padding: 12px 20px; background: #0a0f1d; overflow-x: auto; border-bottom: 1px solid rgba(0,85,255,0.2); scrollbar-width: none; }
        .filtros-nav::-webkit-scrollbar { display: none; }
        .filtro-btn { background: rgba(0, 85, 255, 0.2); border: 1px solid #0055ff; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; white-space: nowrap; text-decoration: none; display: inline-block; }
        .filtro-btn.active { background: #0055ff; font-weight: bold; }

        .categoria-titulo { padding: 20px 20px 10px 20px; font-size: 1.1rem; color: #00d2ff; }
        
        .grid-lista { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
        .filme-card { height: 160px; background: #0a0f1d; border-radius: 8px; border: 1px solid #0055ff; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; text-align: center; padding: 5px; color: #8c92a4; text-decoration: none; transition: transform 0.2s; }
        .filme-card:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <header>
        <span class="logo">PLAY FILMES</span>
        <div>🔍 👤</div>
    </header>

    <!-- Barra de Navegação -->
    <div class="filtros-nav">
        <a href="home.html" class="filtro-btn">Início</a>
        <a href="series.html" class="filtro-btn">Séries</a>
        <a href="filmes.html" class="filtro-btn">Filmes</a>
        <a href="categorias.html" class="filtro-btn">Categorias</a>
        <a href="minhalista.html" class="filtro-btn active">Minha Lista</a>
    </div>

    <!-- Conteúdo da Minha Lista -->
    <div class="categoria-titulo">Salvos para assistir depois</div>
    <div class="grid-lista">
        <a href="detalhes.html" class="filme-card">Meu Favorito 1</a>
        <a href="detalhes.html" class="filme-card">Meu Favorito 2</a>
        <a href="detalhes.html" class="filme-card">Minha Série Salva</a>
    </div>

</body>
</html>
