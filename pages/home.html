    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Trava a tela para evitar rolagem lateral indesejada no app */
        html, body { 
            background-color: #050811; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            width: 100%;
            height: 100%;
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0a0f1d; border-bottom: 1px solid #0055ff; }
        .logo { color: #00d2ff; font-weight: bold; font-size: 1.2rem; }
        
        .filtros-nav { display: flex; gap: 15px; padding: 12px 20px; background: #0a0f1d; overflow-x: auto; border-bottom: 1px solid rgba(0,85,255,0.2); scrollbar-width: none; }
        .filtros-nav::-webkit-scrollbar { display: none; }
        .filtro-btn { background: rgba(0, 85, 255, 0.2); border: 1px solid #0055ff; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; white-space: nowrap; text-decoration: none; display: inline-block; cursor: pointer; }
        .filtro-btn.active { background: #00d2ff; color: #050811; font-weight: bold; }

        .banner-principal { width: 100%; height: 220px; background: linear-gradient(to bottom, transparent, #050811), url('../img/guerracivil.jpg') center/cover; display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box; }
        .btn-assistir { background: #0055ff; color: #fff; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 1rem; border: none; text-decoration: none; display: inline-block; }
        
        .categoria-titulo { padding: 15px 20px 5px 20px; font-size: 1.1rem; color: #00d2ff; }
        
        /* Carrossel suave e travado apenas na horizontal */
        .carrossel { 
            display: flex; 
            overflow-x: auto; 
            gap: 12px; 
            padding: 10px 20px; 
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch;
        }
        .carrossel::-webkit-scrollbar { display: none; }
        
        /* Padrão fixo para todas as capas */
        .filme-card { 
            min-width: 110px; 
            width: 110px;
            height: 160px; 
            background-color: #0a0f1d; 
            border-radius: 8px; 
            border: 1px solid #0055ff; 
            flex-shrink: 0; 
            text-decoration: none; 
            transition: transform 0.2s; 
            background-size: cover !important; 
            background-position: center !important; 
            background-repeat: no-repeat !important;
            position: relative;
            display: inline-block;
        }
        .filme-card:active { transform: scale(0.95); }

        /* Estilo do número azul nos Top Filmes */
        .numero-top {
            position: absolute;
            bottom: 2px;
            left: 6px;
            color: #00d2ff;
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            font-family: sans-serif;
            line-height: 1;
        }
    </style>
</head>
