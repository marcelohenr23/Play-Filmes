<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Início</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #050811; color: #fff; margin: 0; padding-bottom: 50px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0a0f1d; border-bottom: 1px solid #0055ff; }
        .logo { color: #00d2ff; font-weight: bold; font-size: 1.2rem; }
        
        .filtros-nav { display: flex; gap: 15px; padding: 12px 20px; background: #0a0f1d; overflow-x: auto; border-bottom: 1px solid rgba(0,85,255,0.2); scrollbar-width: none; }
        .filtros-nav::-webkit-scrollbar { display: none; }
        .filtro-btn { background: rgba(0, 85, 255, 0.2); border: 1px solid #0055ff; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; white-space: nowrap; text-decoration: none; display: inline-block; cursor: pointer; }
        .filtro-btn.active { background: #0055ff; font-weight: bold; }

        .banner-principal { width: 100%; height: 250px; background: linear-gradient(to bottom, transparent, #050811), url('../img/homemdeferro.jpg') center/cover; display: flex; align-items: flex-end; padding: 20px; }
        .btn-assistir { background: #0055ff; color: #fff; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 1rem; border: none; text-decoration: none; display: inline-block; }
        .categoria-titulo { padding: 15px 20px 5px 20px; font-size: 1.1rem; color: #00d2ff; }
        .carrossel { display: flex; overflow-x: auto; gap: 10px; padding: 10px 20px; scrollbar-width: none; }
        .carrossel::-webkit-scrollbar { display: none; }
        
        .filme-card { min-width: 110px; height: 160px; background: #0a0f1d; border-radius: 8px; border: 1px solid #0055ff; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; font-size: 0.75rem; text-align: center; padding-bottom: 8px; color: #fff; text-decoration: none; transition: transform 0.2s; background-size: cover !important; background-position: center !important; }
        .filme-card span { background: rgba(0, 0, 0, 0.75); padding: 2px 6px; border-radius: 4px; width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .filme-card:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <header>
        <span class="logo">PLAY FILMES</span>
        <div style="display: flex; gap: 15px; align-items: center;">
            <a href="busca.html" style="text-decoration: none; font-size: 1.2rem;">🔍</a>
            <a href="perfil.html" style="text-decoration: none; font-size: 1.2rem;">👤</a>
        </div>
    </header>

    <!-- Menu Superior -->
    <div class="filtros-nav">
        <a href="home.html" class="filtro-btn active">Início</a>
        <a href="series.html" class="filtro-btn">Séries</a>
        <a href="filmes.html" class="filtro-btn">Filmes</a>
        <a href="categorias.html" class="filtro-btn">Categorias</a>
        <a href="minhalista.html" class="filtro-btn">Minha Lista</a>
    </div>

    <div class="banner-principal">
        <div>
            <h2 style="margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Homem de Ferro</h2>
            <a href="detalhes.html?filme=Homem%20de%20Ferro" class="btn-assistir">▶ Assistir</a>
        </div>
    </div>

    <!-- Seção de Filmes -->
    <div class="categoria-titulo">Top 5 Filmes</div>
    <div class="carrossel">
        <a href="detalhes.html?filme=Homem%20de%20Ferro" class="filme-card" style="background: url('../img/homemdeferro.jpg');"><span>Homem de Ferro</span></a>
        <a href="detalhes.html?filme=Creed%20II" class="filme-card" style="background: url('../img/creed2.jpg');"><span>Creed II</span></a>
        <a href="detalhes.html?filme=Invocação%20do%20Mal%202" class="filme-card" style="background: url('../img/invocacao2.jpg');"><span>Invocação do Mal 2</span></a>
        <a href="detalhes.html?filme=A%20Revolução%20dos%20Bichos" class="filme-card" style="background: url('../img/aevolucaodosbichos.jpg');"><span>A Revolução dos Bichos</span></a>
        <a href="detalhes.html?filme=Mais%20Forte%20que%20o%20Mundo" class="filme-card" style="background: url('../img/maisfortequeomundo.jpg');"><span>Mais Forte que o Mundo</span></a>
    </div>

    <div class="categoria-titulo">Filmes em Destaque</div>
    <div class="carrossel">
        <a href="detalhes.html?filme=Creed%20II" class="filme-card" style="background: url('../img/creed2.jpg');"><span>Creed II</span></a>
        <a href="detalhes.html?filme=Homem%20de%20Ferro" class="filme-card" style="background: url('../img/homemdeferro.jpg');"><span>Homem de Ferro</span></a>
        <a href="detalhes.html?filme=Invocação%20do%20Mal%202" class="filme-card" style="background: url('../img/invocacao2.jpg');"><span>Invocação do Mal 2</span></a>
    </div>

</body>
</html>
