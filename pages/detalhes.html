<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Detalhes</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #050811; color: #fff; margin: 0; padding-bottom: 50px; }
        
        .banner-detalhe { width: 100%; height: 280px; background: linear-gradient(to bottom, transparent 60%, #050811), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80') center/cover; position: relative; }
        .btn-voltar-topo { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 50%; font-size: 1.2rem; border: 1px solid rgba(0,85,255,0.3); }

        .info-container { padding: 0 20px; }
        .titulo-filme { font-size: 1.5rem; color: #00d2ff; margin-bottom: 8px; font-weight: bold; }
        .meta-info { display: flex; gap: 15px; font-size: 0.9rem; color: #8c92a4; margin-bottom: 20px; align-items: center; }
        .badge-idade { background: #1b263b; border: 1px solid #0055ff; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; color: #fff; }

        .btn-assistir { background: #0055ff; color: #fff; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; border: none; text-decoration: none; display: block; text-align: center; width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0, 85, 255, 0.4); margin-bottom: 20px; transition: transform 0.2s; }
        .btn-assistir:active { transform: scale(0.98); }

        .sinopse { font-size: 0.95rem; color: #b0b4c0; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- Banner Superior com Botão de Voltar -->
    <div class="banner-detalhe" id="bannerDetalhe">
        <a href="home.html" class="btn-voltar-topo">‹</a>
    </div>

    <!-- Informações do Filme/Série -->
    <div class="info-container">
        <div class="titulo-filme">Aventura Espacial</div>
        
        <div class="meta-info">
            <span>2026</span>
            <span class="badge-idade">12+</span>
            <span>2h 15m</span>
            <span>Ficção Científica</span>
        </div>

        <!-- Botão Assistir Agora integrado ao Player -->
        <a href="player.html" class="btn-assistir">▶ Assistir Agora</a>

        <div class="sinopse">
            Em um futuro distante, um grupo de exploradores viaja através de fendas desconhecidas no espaço em busca de um novo lar para a humanidade, enfrentando perigos cósmicos e escolhas difíceis.
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const nomeFilme = params.get('filme');
            
            if (nomeFilme) {
                // Atualiza o título do filme na tela de detalhes
                const tituloElemento = document.querySelector('.titulo-filme');
                if (tituloElemento) {
                    tituloElemento.textContent = nomeFilme;
                }

                // Busca a imagem correta salva no localStorage para colocar no banner de fundo
                const filmesSalvos = JSON.parse(localStorage.getItem('filmesImagens')) || [];
                const filmeEncontrado = filmesSalvos.find(f => f.titulo === nomeFilme);

                if (filmeEncontrado) {
                    const banner = document.getElementById('bannerDetalhe');
                    if (banner) {
                        banner.style.background = `linear-gradient(to bottom, transparent 60%, #050811), url(${filmeEncontrado.imagem}) center/cover`;
                    }
                }
            }
        });
    </script>
</body>
</html>
