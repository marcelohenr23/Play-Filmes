<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Detalhes</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #050811; color: #fff; margin: 0; padding-bottom: 50px; }
        .banner-detalhe { width: 100%; height: 350px; background: linear-gradient(to bottom, transparent 40%, #050811), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80') center/cover; position: relative; }
        .voltar-btn { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.6); color: #fff; border: 1px solid #0055ff; padding: 8px 12px; border-radius: 50%; text-decoration: none; font-size: 1.1rem; }
        .conteudo-detalhe { padding: 0 20px; margin-top: -30px; position: relative; }
        .titulo-filme { font-size: 1.8rem; color: #00d2ff; margin-bottom: 10px; font-weight: bold; }
        .info-extras { display: flex; gap: 15px; font-size: 0.9rem; color: #8c92a4; margin-bottom: 15px; }
        .btn-assistir-grande { width: 100%; background: #0055ff; color: #fff; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; border: none; text-align: center; display: block; text-decoration: none; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(0, 85, 255, 0.4); }
        .sinopse { font-size: 0.95Krem; color: #ccc; line-height: 1.5; margin-bottom: 25px; }
    </style>
</head>
<body>

    <!-- Banner com fundo do filme -->
    <div class="banner-detalhe">
        <a href="home.html" class="voltar-btn">⬅</a>
    </div>

    <!-- Informações do Filme -->
    <div class="conteudo-detalhe">
        <div class="titulo-filme">Aventura Espacial</div>
        
        <div class="info-extras">
            <span>2026</span>
            <span style="border: 1px solid #0055ff; padding: 0 6px; border-radius: 4px; color: #00d2ff;">12+</span>
            <span>2h 15m</span>
            <span>Ficção Científica</span>
        </div>

        <a href="#" class="btn-assistir-grande">▶ Assistir Agora</a>

        <div class="sinopse">
            Em um futuro distante, um grupo de exploradores viaja através de fendas desconhecidas no espaço em busca de um novo lar para a humanidade, enfrentando perigos cósmicos e escolhas difíceis.
        </div>
    </div>

</body>
</html>
