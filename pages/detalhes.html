        body { background-color: #050811; color: #fff; margin: 0; padding-bottom: 50px; }
        
        /* Área do Trailer / Imagem de Capa no Topo */
        .banner-detalhe { width: 100%; height: 260px; background-size: cover; background-position: center; position: relative; background-color: #000; }

        .btn-voltar-topo { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: #fff; text-decoration: none; padding: 4px 10px; border-radius: 50%; font-size: 1.4rem; border: 1px solid rgba(0,85,255,0.3); z-index: 10; }

        /* Estilo para quando o trailer for um vídeo incorporado */
        .banner-detalhe iframe { width: 100%; height: 100%; border: none; }

        .info-container { padding: 0 20px; }
        .titulo-filme { font-size: 1.5rem; color: #00d2ff; margin-bottom: 8px; font-weight: bold; }
        .meta-info { display: flex; gap: 15px; font-size: 0.9rem; color: #8c92a4; margin-bottom: 15px; align-items: center; }
        .badge-idade { background: #1b263b; border: 1px solid #0055ff; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; color: #fff; }

        .botoes-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-acao { background: #0055ff; color: #fff; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; border: none; text-decoration: none; display: block; text-align: center; flex: 1; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0, 85, 255, 0.4); transition: transform 0.2s; cursor: pointer; }
        .btn-trailer { background: rgba(0, 85, 255, 0.2); border: 1px solid #0055ff; color: #00d2ff; box-shadow: none; }
        .btn-acao:active { transform: scale(0.98); }

        .sinopse { font-size: 0.95rem; color: #b0b4c0; line-height: 1.5; }

                ano: "2017", idade: "16+", duracao: "1h 52m", genero: "Ação / Suspense",
                imagem: "../img/oassassino.jpg",
                trailer: "https://www.youtube.com/embed/0G6wNq76mBc",
                sinopse: "Acompanha a ascensão de Mitch Rapp, um agente de operações secretas da CIA que sofreu uma perda trágica e agora trabalha sob a tutela de um veterano da Guerra Fria para combater células terroristas."
            },
            "O Hobbit: A Batalha dos Cinco Exércitos": {
                ano: "2014", idade: "12+", duracao: "2h 24m", genero: "Fantasia / Aventura",
                imagem: "../img/ohobbit5.jpg",
                trailer: "https://www.youtube.com/embed/ZSzeFFhKEs4",
                sinopse: "Thorin Escudo de Carvalho e os anões de Erebor reclamaram a vastas riquezas de sua terra natal, mas agora enfrentam as consequências de liberar o dragão Smaug e a iminência de uma guerra épica."
            }
        };

        window.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const nomeFilme = params.get('filme') || "Pantera Negra";
            
            const tituloElemento = document.getElementById('tituloFilme');
            const banner = document.getElementById('bannerDetalhe');
            const anoEl = document.getElementById('anoFilme');
            const idadeEl = document.getElementById('idadeFilme');
            const duracaoEl = document.getElementById('duracaoFilme');
            const generoEl = document.getElementById('generoFilme');
            const sinopseEl = document.getElementById('sinopseFilme');
            const btnTrailer = document.getElementById('btnVerTrailer');
            const btnAssistir = document.getElementById('btnAssistir');

            if (tituloElemento) tituloElemento.textContent = nomeFilme;

            // Envia o nome do filme correto para o player.html
            if (btnAssistir) {
                btnAssistir.href = `player.html?filme=${encodeURIComponent(nomeFilme)}`;
            }

            // 1. Tenta buscar primeiro no localStorage (filmes cadastrados automaticamente)
            const filmesSalvos = JSON.parse(localStorage.getItem('filmesImagens')) || [];
            const salvo = filmesSalvos.find(f => f.titulo === nomeFilme);

            let dados = null;

            if (salvo) {
                dados = {
                    ano: salvo.ano || "2026",
                    idade: salvo.idade || "12+",
                    duracao: salvo.duracao || "2h 00m",
                    genero: salvo.genero || "Filme",
                    imagem: salvo.imagem,
                    trailer: salvo.trailer || "",
                    sinopse: salvo.sinopse || "Sinopse não informada para este título."
                };
            } else {
                // 2. Se não estiver no localStorage, pega do banco fixo
                dados = bancoFilmes[nomeFilme] || bancoFilmes["Pantera Negra"];
            }

            // Aplica os dados na tela
            if (anoEl) anoEl.textContent = dados.ano;
            if (idadeEl) idadeEl.textContent = dados.idade;
            if (duracaoEl) duracaoEl.textContent = dados.duracao;
            if (generoEl) generoEl.textContent = dados.genero;
            if (sinopseEl) sinopseEl.textContent = dados.sinopse;

            if (banner) {
                banner.style.backgroundImage = `url('${dados.imagem}')`;
            }

            // Alternar entre imagem de capa e o trailer do YouTube
            let mostrandoTrailer = false;
            if (btnTrailer) {
                btnTrailer.addEventListener('click', function() {
                    if (dados.trailer) {
                        if (!mostrandoTrailer) {
                            banner.style.backgroundImage = 'none';
                            banner.innerHTML = `<a href="home.html" class="btn-voltar-topo">‹</a><iframe src="${dados.trailer}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                            btnTrailer.textContent = "🖼 Ver Capa";
                            mostrandoTrailer = true;
                        } else {
                            banner.innerHTML = `<a href="home.html" class="btn-voltar-topo">‹</a>`;
                            banner.style.backgroundImage = `url('${dados.imagem}')`;
                            btnTrailer.textContent = "🎬 Ver Trailer";
                            mostrandoTrailer = false;
                        }
                    } else {
                        alert("Trailer indisponível para este título.");
                    }
                });
            }
        });
    </script>
</body>
</html>
