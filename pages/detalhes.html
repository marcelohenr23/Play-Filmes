<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Detalhes</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #050811; color: #fff; margin: 0; padding-bottom: 50px; font-family: sans-serif; }
        
        /* Banner com gradiente elegante para substituir imagens quebradas */
        .banner-detalhe { 
            width: 100%; 
            height: 220px; 
            background: linear-gradient(135deg, #0b132b, #1c2541, #0055ff); 
            position: relative; 
        }
        .btn-voltar-topo { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: #fff; text-decoration: none; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 1.4rem; border: 1px solid rgba(0,85,255,0.3); z-index: 10; }

        .banner-detalhe iframe { width: 100%; height: 100%; border: none; }

        .info-container { padding: 20px; }
        .titulo-filme { font-size: 1.5rem; color: #00d2ff; margin-bottom: 8px; font-weight: bold; }
        .meta-info { display: flex; gap: 12px; font-size: 0.9rem; color: #8c92a4; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        .badge-idade { background: #1b263b; border: 1px solid #0055ff; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; color: #fff; }

        .botoes-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-acao { background: #0055ff; color: #fff; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; border: none; text-decoration: none; display: block; text-align: center; flex: 1; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0, 85, 255, 0.4); cursor: pointer; }
        .btn-trailer { background: rgba(0, 85, 255, 0.2); border: 1px solid #0055ff; color: #00d2ff; box-shadow: none; }

        .sinopse { font-size: 0.95rem; color: #b0b4c0; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="banner-detalhe" id="bannerDetalhe">
        <a href="home.html" class="btn-voltar-topo">‹</a>
    </div>

    <div class="info-container">
        <div class="titulo-filme" id="tituloFilme">Carregando...</div>
        
        <div class="meta-info">
            <span id="anoFilme">--</span>
            <span class="badge-idade" id="idadeFilme">12+</span>
            <span id="duracaoFilme">--</span>
            <span id="generoFilme">--</span>
        </div>

        <div class="botoes-container">
            <a href="player.html" class="btn-acao" id="btnAssistir">▶ Assistir Agora</a>
            <button class="btn-acao btn-trailer" id="btnVerTrailer">🎬 Ver Trailer</button>
        </div>

        <div class="sinopse" id="sinopseFilme">
            Carregando sinopse...
        </div>
    </div>

    <script>
        // Banco de dados completo
        const bancoFilmes = {
            "Pantera Negra": { ano: "2018", idade: "14+", duracao: "2h 14m", genero: "Ação / Ficção", trailer: "https://www.youtube.com/embed/xjDjIWPwcPU", sinopse: "T'Challa, herdeiro do reino de Wakanda, precisa se defender de inimigos estrangeiros e disputas internas pelo trono após a morte de seu pai." },
            "Thor Ragnarok": { ano: "2017", idade: "12+", duracao: "2h 10m", genero: "Ação / Aventura", trailer: "https://www.youtube.com/embed/ue80QwXMRHg", sinopse: "Prisioneiro do outro lado do universo, Thor se encontra em uma corrida contra o tempo para retornar a Asgard e impedir o Ragnarok." },
            "Guerra Civil": { ano: "2016", idade: "12+", duracao: "2h 27m", genero: "Ação / Aventura", trailer: "https://www.youtube.com/embed/dKrVegVI0Us", sinopse: "A intervenção governamental nos Vingadores provoca uma fenda profunda entre o Capitão América e o Homem de Ferro." },
            "Homem de Ferro": { ano: "2008", idade: "12+", duracao: "2h 06m", genero: "Ação / Ficção", trailer: "https://www.youtube.com/embed/8ugaeA-nMTc", sinopse: "Tony Stark é um industrial bilionário que constrói uma armadura de alta tecnologia para escapar do cativeiro e salvar o mundo." },
            "Jumanji": { ano: "2017", idade: "12+", duracao: "1h 59m", genero: "Aventura / Comédia", trailer: "https://www.youtube.com/embed/2QKg5SZ_35I", sinopse: "Quatro adolescentes entram em um videogame perigoso e precisam zerar o jogo para escapar vivos." },
            "Liga da Justiça": { ano: "2017", idade: "12+", duracao: "2h 00m", genero: "Ação / Aventura", trailer: "https://www.youtube.com/embed/3cxixDgHUYw", sinopse: "Bruce Wayne se une à sua nova aliada, Diana Prince, para enfrentar um inimigo ainda maior." }
        };

        window.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            
            // Pega o parâmetro 'filme' ou tenta ler 'nome' caso o link mande de outro jeito
            let nomeFilme = params.get('filme') || params.get('nome') || "Pantera Negra";
            
            // Limpa espaços extras ou símbolos caso venham corrompidos
            nomeFilme = decodeURIComponent(nomeFilme.trim());

            const tituloElemento = document.getElementById('tituloFilme');
            const anoEl = document.getElementById('anoFilme');
            const idadeEl = document.getElementById('idadeFilme');
            const duracaoEl = document.getElementById('duracaoFilme');
            const generoEl = document.getElementById('generoFilme');
            const sinopseEl = document.getElementById('sinopseFilme');
            const btnAssistir = document.getElementById('btnAssistir');
            const banner = document.getElementById('bannerDetalhe');

            // Define o título na tela imediatamente
            if (tituloElemento) tituloElemento.textContent = nomeFilme;

            // Atualiza o link do player para o filme correto
            if (btnAssistir) {
                btnAssistir.href = `player.html?filme=${encodeURIComponent(nomeFilme)}`;
            }

            // Busca os dados no banco (se não achar, pega o Pantera Negra como padrão)
            let dados = bancoFilmes[nomeFilme] || {
                ano: "2026", idade: "12+", duracao: "1h 50m", genero: "Filme / Ação",
                trailer: "", sinopse: "Informações detalhadas sobre este título em breve no catálogo."
            };

            // Preenche os elementos da página com os dados encontrados
            if (anoEl) anoEl.textContent = dados.ano;
            if (idadeEl) idadeEl.textContent = dados.idade;
            if (duracaoEl) duracaoEl.textContent = dados.duracao;
            if (generoEl) generoEl.textContent = dados.genero;
            if (sinopseEl) sinopseEl.textContent = dados.sinopse;

            // Botão de Trailer
            const btnTrailer = document.getElementById('btnVerTrailer');
            let mostrandoTrailer = false;
            if (btnTrailer) {
                btnTrailer.addEventListener('click', function() {
                    if (dados.trailer) {
                        if (!mostrandoTrailer) {
                            banner.style.background = '#000';
                            banner.innerHTML = `<a href="home.html" class="btn-voltar-topo">‹</a><iframe src="${dados.trailer}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                            btnTrailer.textContent = "🖼 Ocultar Trailer";
                            mostrandoTrailer = true;
                        } else {
                            banner.innerHTML = `<a href="home.html" class="btn-voltar-topo">‹</a>`;
                            banner.style.background = 'linear-gradient(135deg, #0b132b, #1c2541, #0055ff)';
                            btnTrailer.textContent = "🎬 Ver Trailer";
                            mostrandoTrailer = false;
                        }
                    } else {
                        alert("Trailer indisponível para este título.");
                    }
                });
            }
        });
    </script>
</body>
</html>
