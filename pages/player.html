<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Filmes - Reproduzindo</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #000; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        
        /* Topo do Player com botão de voltar */
        .player-header { display: flex; align-items: center; padding: 15px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); position: absolute; top: 0; width: 100%; z-index: 10; box-sizing: border-box; }
        .btn-voltar { color: #fff; font-size: 1.5rem; text-decoration: none; margin-right: 15px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }
        .titulo-video { font-size: 1.1rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); color: #00d2ff; }

        /* Tela do Player ocupando a tela inteira com o iframe */
        .player-screen { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; width: 100%; height: 100%; }
        .player-screen iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Topo -->
    <div class="player-header">
        <a href="#" id="btnVoltarDetalhes" class="btn-voltar">‹</a>
        <span class="titulo-video" id="tituloVideo">Carregando filme...</span>
    </div>

    <!-- Tela do Vídeo (Iframe do player injetado aqui) -->
    <div class="player-screen" id="playerContainer">
        <!-- O player real será inserido via JavaScript -->
    </div>

    <script>
        // Banco de dados contendo os links/iframes reais de player para cada filme
        const linksPlayers = {
            "Warcraft": '<iframe src="https://betterflix.lat/api/player?id=68735&type=movie" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>',
            "Pantera Negra": '<iframe src="https://betterflix.lat/api/player?id=284054&type=movie" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>',
            "Guerra Civil": '<iframe src="https://betterflix.lat/api/player?id=271110&type=movie" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>',
            "Homem de Ferro 2": '<iframe src="https://betterflix.lat/api/player?id=10138&type=movie" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>',
            "Jumanji": '<iframe src="https://betterflix.lat/api/player?id=353486&type=movie" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>',
            "15h17 Trem para Paris": '<iframe src="https://betterflix.lat/api/player?id=463927&type=movie" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>',
            "X-Men Apocalipse": '<iframe src="https://betterflix.lat/api/player?id=246655&type=movie" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>'
        };

        window.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const nomeFilme = params.get('filme') || "Warcraft";

            // Atualiza o título no topo
            document.getElementById('tituloVideo').textContent = nomeFilme + " - Dublado";

            // Configura o botão de voltar para retornar para a página de detalhes correta do filme
            document.getElementById('btnVoltarDetalhes').href = `detalhes.html?filme=${encodeURIComponent(nomeFilme)}`;

            // Injeta o player correspondente na tela
            const container = document.getElementById('playerContainer');
            if (linksPlayers[nomeFilme]) {
                container.innerHTML = linksPlayers[nomeFilme];
            } else {
                // Player padrão caso não encontre específico
                container.innerHTML = `<iframe src="https://betterflix.lat/api/player?id=68735&type=movie" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>`;
            }
        });
    </script>
</body>
</html>
