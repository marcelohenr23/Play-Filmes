<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Reproduzindo</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #000; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        
        /* Topo do Player com botão de voltar */
        .player-header { display: flex; align-items: center; padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); position: absolute; top: 0; width: 100%; z-index: 10; }
        .btn-voltar { color: #fff; font-size: 1.5rem; text-decoration: none; margin-right: 15px; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 50%; }
        .titulo-video { font-size: 1.1rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* Tela simulando o vídeo rodando */
        .player-screen { flex: 1; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #0a0f1d 0%, #000 100%); position: relative; }
        .play-simulado { font-size: 4rem; color: rgba(0, 210, 255, 0.6); animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        /* Barra de controles inferior */
        .player-controls { padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; flex-direction: column; gap: 10px; }
        .barra-progresso { width: 100%; height: 5px; background: rgba(255,255,255,0.3); border-radius: 5px; position: relative; }
        .progresso-atual { width: 35%; height: 100%; background: #0055ff; border-radius: 5px; }
        .controles-botoes { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #8c92a4; }
    </style>
</head>
<body>

    <!-- Topo -->
    <div class="player-header">
        <a href="detalhes.html" class="btn-voltar">‹</a>
        <span class="titulo-video">Aventura Espacial - Dublado</span>
    </div>

    <!-- Tela do Vídeo -->
    <div class="player-screen">
        <div class="play-simulado">▶</div>
    </div>

    <!-- Controles -->
    <div class="player-controls">
        <div class="barra-progresso">
            <div class="progresso-atual"></div>
        </div>
        <div class="controles-botoes">
            <span>14:20</span>
            <span>🔊 ⚙️ 📺</span>
            <span>-45:10</span>
        </div>
    </div>

</body>
</html>
