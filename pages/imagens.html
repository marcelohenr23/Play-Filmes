<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Gerenciar Imagens</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: #050811 !important;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 85, 255, 0.3);
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            margin-top: 20px;
        }
        h1 {
            color: #00d2ff;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #8c92a4;
            font-size: 0.9rem;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #0055ff;
            background: #050811;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #0055ff;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        button:hover {
            background: #0042cc;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00d2ff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Adicionar Imagem de Filme</h1>
        
        <form id="form-imagem" onsubmit="salvarImagem(event)">
            <div class="form-group">
                <label>Título do Filme</label>
                <input type="text" id="tituloFilme" placeholder="Ex: Vingadores" required>
            </div>
            
            <div class="form-group">
                <label>Selecione a Imagem (Capa/Poster)</label>
                <input type="file" id="arquivoImagem" accept="image/*" required>
            </div>

            <button type="submit">Salvar Imagem</button>
        </form>

        <a href="home.html" class="back-link">Voltar para a Home</a>
    </div>

    <script>
        function salvarImagem(event) {
            event.preventDefault();
            const titulo = document.getElementById('tituloFilme').value;
            const inputArquivo = document.getElementById('arquivoImagem');
            
            if (inputArquivo.files && inputArquivo.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const imagemBase64 = e.target.result;
                    
                    // Salvando no localStorage do navegador para simular o banco de dados do app
                    let imagensSalvas = JSON.parse(localStorage.getItem('filmesImagens')) || [];
                    imagensSalvas.push({ titulo: titulo, imagem: imagemBase64 });
                    localStorage.setItem('filmesImagens', JSON.stringify(imagensSalvas));
                    
                    alert('Imagem do filme cadastrada com sucesso!');
                    document.getElementById('form-imagem').reset();
                };
                
                reader.readAsDataURL(inputArquivo.files[0]);
            }
        }
    </script>
</body>
</html>
