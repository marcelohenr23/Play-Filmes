<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Categorias</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #050811; color: #fff; margin: 0; padding-bottom: 50px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0a0f1d; border-bottom: 1px solid #0055ff; }
        .logo { color: #00d2ff; font-weight: bold; font-size: 1.2rem; }
        
        .filtros-nav { display: flex; gap: 15px; padding: 12px 20px; background: #0a0f1d; overflow-x: auto; border-bottom: 1px solid rgba(0,85,255,0.2); scrollbar-width: none; }
        .filtros-nav::-webkit-scrollbar { display: none; }
        .filtro-btn { background: rgba(0, 85, 255, 0.2); border: 1px solid #0055ff; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; white-space: nowrap; text-decoration: none; display: inline-block; }
        .filtro-btn.active { background: #0055ff; font-weight: bold; }

        .grid-categorias { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .categoria-card { background: #0a0f1d; border: 1px solid #0055ff; border-radius: 10px; padding: 25px 15px; text-align: center; color: #00d2ff; font-weight: bold; font-size: 1.1rem; text-decoration: none; box-shadow: 0 4px 10px rgba(0, 85, 255, 0.2); transition: transform 0.2s; }
        .categoria-card:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <header>
        <span class="logo">PLAY FILMES</span>
        <div>🔍 👤</div>
    </header>

    <!-- Barra de Navegação -->
    <div class="filtros-nav">
        <a href="home.html" class="filtro-btn">Início</a>
        <a href="series.html" class="filtro-btn">Séries</a>
        <a href="filmes.html" class="filtro-btn">Filmes</a>
        <a href="categorias.html" class="filtro-btn active">Categorias</a>
        <a href="minhalista.html" class="filtro-btn">Minha Lista</a>
    </div>

    <!-- Grade de Categorias -->
    <div class="grid-categorias">
        <a href="filmes.html" class="categoria-card">Ação</a>
        <a href="filmes.html" class="categoria-card">Comédia</a>
        <a href="series.html" class="categoria-card">Drama</a>
        <a href="filmes.html" class="categoria-card">Ficção Científica</a>
        <a href="series.html" class="categoria-card">Terror</a>
        <a href="filmes.html" class="categoria-card">Animação</a>
        <a href="series.html" class="categoria-card">Romance</a>
        <a href="filmes.html" class="categoria-card">Aventura</a>
    </div>

</body>
</html>
