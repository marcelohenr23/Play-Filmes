<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Filmes - Catálogo</title>
    <style>
        :root {
            --bg-color: #070913;
            --card-bg: #0f1528;
            --neon-blue: #00f0ff;
            --neon-glow: rgba(0, 240, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #8c9bae;
            --border-color: #1e2942;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: rgba(7, 9, 19, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #111a30, #0a0f1d);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px var(--neon-glow);
        }

        .logo-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--neon-blue);
            pointer-events: none;
        }

        .logo-area h1 {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Área de Perfil e Login no Topo */
        .user-actions-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-main);
            text-decoration: none;
            transition: border-color 0.2s;
        }

        .user-profile-badge:hover {
            border-color: var(--neon-blue);
        }

        .user-profile-badge span {
            font-size: 14px;
        }

        /* Banner de Boas-vindas */
        .welcome-banner {
            padding: 25px 20px 15px 20px;
        }

        .welcome-banner h2 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .welcome-banner p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Títulos de Categorias */
        .category-section {
            margin-bottom: 22px;
        }

        .category-title {
            font-size: 15px;
            font-weight: 700;
            padding: 0 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-title.has-border {
            border-left: 3px solid var(--neon-blue);
        }

        /* Carrossel Horizontal */
        .carousel {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 20px 10px 20px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .carousel::-webkit-scrollbar {
            display: none;
        }

        .movie-card {
            flex: 0 0 120px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            scroll-snap-align: start;
            position: relative;
            user-select: none;
        }

        .movie-poster {
            width: 100%;
            height: 165px;
            background: #151d35;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            position: relative;
            overflow: hidden;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer; /* Indica que só a imagem abre o player */
        }

        .top-number-badge {
            position: absolute;
            bottom: -5px;
            left: -5px;
            font-size: 40px;
            font-weight: 900;
            color: var(--text-main);
            -webkit-text-stroke: 2px var(--bg-color);
            text-shadow: 0 0 10px var(--neon-blue);
            z-index: 2;
            pointer-events: none;
        }

        .movie-card.no-top .movie-poster {
            height: 170px;
        }

        .movie-info {
            padding: 8px;
            pointer-events: none;
        }

        .movie-title {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 1px;
        }

        .movie-genre {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* --- TELA DE DETALHES / PLAYER --- */
        #moviePlayerScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 999999;
            overflow-y: auto;
        }

        .player-header-banner {
            width: 100%;
            height: 280px;
            position: relative;
            background: #111;
        }

        .player-header-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        .player-header-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(to top, var(--bg-color), transparent);
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .player-content {
            padding: 0 20px 40px 20px;
            margin-top: -15px;
            position: relative;
            z-index: 2;
        }

        .player-top-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--neon-blue);
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 8px var(--neon-glow);
        }

        .player-movie-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .player-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .player-meta span.badge-hd {
            border: 1px solid var(--border-color);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10px;
            color: #fff;
        }

        .btn-action-primary {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 13px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-action-secondary {
            width: 100%;
            background-color: #1a2238;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 13px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .player-synopsis {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .player-actions-row {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
            margin-bottom: 25px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            cursor: pointer;
        }

        .action-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Menu Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 21, 40, 0.98);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--neon-blue);
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- TELA PRINCIPAL (CATÁLOGO) -->
    <div id="catalogScreen">
        <!-- Header -->
        <header class="header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M18,5H16.89C17.47,4.11 17.8,3.08 17.8,2H15.8C15.8,3.11 15.2,4.09 14.33,4.64C13.8,3.7 12.96,3 12,3C11.04,3 10.2,3.7 9.67,4.64C8.8,4.09 8.2,3.11 8.2,2H6.2C6.2,3.08 6.53,4.11 7.11,5H6C4.89,5 4,5.89 4,7V20C4,21.1 4.89,22 6,22H18C19.1,22 20,21.1 20,20V7C20,5.89 19.1,5 18,5M18,20H6V7H18V20Z"/>
                    </svg>
                </div>
                <h1>PLAY FILMES</h1>
            </div>

            <!-- Botão de Perfil / Login Restaurado -->
            <div class="user-actions-header">
                <a href="perfil.html" class="user-profile-badge" id="profileBadge">
                    <span id="userAvatar">🍿</span>
                    <strong id="userNameText">Perfil</strong>
                </a>
            </div>
        </header>

        <!-- Saudação -->
        <div class="welcome-banner">
            <h2 id="welcomeTitle">Olá!</h2>
            <p>Explore nosso catálogo</p>
        </div>

        <!-- SEÇÃO: FILMES -->
        <div class="category-section">
            <div class="category-title has-border">🎬 Filmes</div>
            <div class="carousel">
                <div class="movie-card no-top" data-title="Cores da Justiça" data-img="img/coresdajustica.jpg" data-genre="Ação" data-synopsis="Um thriller de ação eletrizante onde a busca por justiça cruza os limites da lei nas ruas da cidade.">
                    <div class="movie-poster"><img src="img/coresdajustica.jpg" alt="Cores da Justiça"></div>
                    <div class="movie-info"><div class="movie-title">Cores da Justiça</div><div class="movie-genre">Ação</div></div>
                </div>
                <div class="movie-card no-top" data-title="Johnny English" data-img="img/jonyingles.jpg" data-genre="Comédia" data-synopsis="O agente secreto mais atrapalhado do mundo precisa salvar a coroa britânica em uma aventura hilária.">
                    <div class="movie-poster"><img src="img/jonyingles.jpg" alt="Johnny English"></div>
                    <div class="movie-info"><div class="movie-title">Johnny English</div><div class="movie-genre">Comédia</div></div>
                </div>
                <div class="movie-card no-top" data-title="Tubarão de 6 Cabeças" data-img="img/oataquedos6tubaroes.jpg" data-genre="Terror" data-synopsis="Turistas em uma ilha isolada enfrentam o terror absoluto quando uma abominação marinha mutante com seis cabeças os persegue.">
                    <div class="movie-poster"><img src="img/oataquedos6tubaroes.jpg" alt="Tubarão de 6 Cabeças"></div>
                    <div class="movie-info"><div class="movie-title">Tubarão de 6 Cabeças</div><div class="movie-genre">Terror</div></div>
                </div>
                <div class="movie-card no-top" data-title="Diga Quem Morre" data-img="img/quemmorre.jpg" data-genre="Suspense" data-synopsis="Um jogo mortal onde os participantes precisam tomar decisões impossíveis antes que o tempo se esgote.">
                    <div class="movie-poster"><img src="img/quemmorre.jpg" alt="Diga Quem Morre"></div>
                    <div class="movie-info"><div class="movie-title">Diga Quem Morre</div><div class="movie-genre">Suspense</div></div>
                </div>
            </div>
        </div>

        <!-- SEÇÃO: TOP 10 FILMES -->
        <div class="category-section">
            <div class="category-title">🏆 Top 10 Filmes</div>
            <div class="carousel">
                <div class="movie-card" data-title="Cores da Justiça" data-img="img/coresdajustica.jpg" data-genre="Ação" data-synopsis="Um thriller de ação eletrizante onde a busca por justiça cruza os limites da lei nas ruas da cidade.">
                    <div class="movie-poster"><img src="img/coresdajustica.jpg" alt="Cores da Justiça"><span class="top-number-badge">1</span></div>
                    <div class="movie-info"><div class="movie-title">Cores da Justiça</div><div class="movie-genre">Ação</div></div>
                </div>
                <div class="movie-card" data-title="Johnny English" data-img="img/jonyingles.jpg" data-genre="Comédia" data-synopsis="O agente secreto mais atrapalhado do mundo precisa salvar a coroa britânica em uma aventura hilária.">
                    <div class="movie-poster"><img src="img/jonyingles.jpg" alt="Johnny English"><span class="top-number-badge">2</span></div>
                    <div class="movie-info"><div class="movie-title">Johnny English</div><div class="movie-genre">Comédia</div></div>
                </div>
                <div class="movie-card" data-title="Tubarão de 6 Cabeças" data-img="img/oataquedos6tubaroes.jpg" data-genre="Terror" data-synopsis="Turistas em uma ilha isolada enfrentam o terror absoluto quando uma abominação marinha mutante com seis cabeças os persegue.">
                    <div class="movie-poster"><img src="img/oataquedos6tubaroes.jpg" alt="Tubarão de 6 Cabeças"><span class="top-number-badge">3</span></div>
                    <div class="movie-info"><div class="movie-title">Tubarão de 6 Cabeças</div><div class="movie-genre">Terror</div></div>
                </div>
                <div class="movie-card" data-title="Diga Quem Morre" data-img="img/quemmorre.jpg" data-genre="Suspense" data-synopsis="Um jogo mortal onde os participantes precisam tomar decisões impossíveis antes que o tempo se esgote.">
                    <div class="movie-poster"><img src="img/quemmorre.jpg" alt="Diga Quem Morre"><span class="top-number-badge">4</span></div>
                    <div class="movie-info"><div class="movie-title">Diga Quem Morre</div><div class="movie-genre">Suspense</div></div>
                </div>
            </div>
        </div>
    </div>

  <!-- MENU INFERIOR -->
    <nav class="bottom-nav">
        <button class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Início
        </button>
        <button class="nav-item" onclick="window.location.href='perfil.html'">
            <svg viewBox="0 0 24 24"><path d="M18 2h-8C6.13 2 3 5.13 3 9v6c0 3.87 3.13 7 7 7h8c3.87 0 7-3.13 7-7V9c0-3.87-3.13-7-7-7zm-5 6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 10c-2.03 0-4.43-.82-5.82-2.33C8.55 14.35 10.65 14 13 14s4.45.35 5.82 1.66C17.43 17.18 15.03 18 13 18z"/></svg>
            Perfil
        </button>
    </nav>

    <!-- SCRIPTS -->
    <script>
        // 1. Lógica para carregar o nome/avatar se o cliente estiver logado (localStorage)
        window.addEventListener('DOMContentLoaded', () => {
            const loggedUser = localStorage.getItem('usuarioLogado') || sessionStorage.getItem('usuarioLogado');
            const userNameText = document.getElementById('userNameText');
            const welcomeTitle = document.getElementById('welcomeTitle');

            if (loggedUser) {
                userNameText.innerText = loggedUser;
                welcomeTitle.innerText = `Olá, ${loggedUser}!`;
            }
        });

        // 2. Lógica para abrir o player SOMENTE ao clicar na imagem do pôster
        const movieImages = document.querySelectorAll('.movie-card img');
        const moviePlayerScreen = document.getElementById('moviePlayerScreen');
        const playerBackBtn = document.getElementById('playerBackBtn');

        const playerTitle = document.getElementById('playerTitle');
        const playerBannerImg = document.getElementById('playerBannerImg');
        const playerGenreTag = document.getElementById('playerGenreTag');
        const playerGenreSub = document.getElementById('playerGenreSub');
        const playerSynopsis = document.getElementById('playerSynopsis');

        movieImages.forEach(imgElement => {
            imgElement.addEventListener('click', (e) => {
                const card = e.target.closest('.movie-card');
                if (!card) return;

                const title = card.getAttribute('data-title');
                const img = card.getAttribute('data-img');
                const genre = card.getAttribute('data-genre');
                const synopsis = card.getAttribute('data-synopsis');

                playerTitle.innerText = title;
                playerBannerImg.src = img;
                playerGenreTag.innerText = genre;
                playerGenreSub.innerText = genre;
                playerSynopsis.innerText = synopsis;

                moviePlayerScreen.style.display = 'block';
                window.scrollTo(0, 0);
            });
        });

        playerBackBtn.addEventListener('click', () => {
            moviePlayerScreen.style.display = 'none';
        });
    </script>
</body>
</html>
